name: Build SiddTradu17 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: "gradle"

      - name: Prepare Android SDK licenses & packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble project workspace & build APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          mkdir -p /tmp/siddtradu17/app/src/main/java/com/cuentalmt17/gametraduccin/overlay
          mkdir -p /tmp/siddtradu17/app/src/main/java/com/cuentalmt17/gametraduccin/capture
          mkdir -p /tmp/siddtradu17/app/src/main/java/com/cuentalmt17/gametraduccin/ocr
          mkdir -p /tmp/siddtradu17/app/src/main/java/com/cuentalmt17/gametraduccin/translate
          mkdir -p /tmp/siddtradu17/app/src/main/res/drawable

          cat <<'EOF' > /tmp/siddtradu17/settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SiddTradu17"
          include(":app")
          EOF

          cat <<'EOF' > /tmp/siddtradu17/build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat <<'EOF' > /tmp/siddtradu17/gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          if [ -f "app/build.gradle.kts" ]; then
            cp "app/build.gradle.kts" /tmp/siddtradu17/app/build.gradle.kts
          fi

          if [ -f "AndroidManifest.xml" ]; then
            cp "AndroidManifest.xml" /tmp/siddtradu17/app/src/main/AndroidManifest.xml
          elif [ -f "app/src/main/AndroidManifest.xml" ]; then
            cp "app/src/main/AndroidManifest.xml" /tmp/siddtradu17/app/src/main/AndroidManifest.xml
          fi

          if [ -f "ic_launcher_sidd.png" ]; then
            cp "ic_launcher_sidd.png" /tmp/siddtradu17/app/src/main/res/drawable/ic_launcher_sidd.png
          elif [ -f "app/src/main/res/drawable/ic_launcher_sidd.png" ]; then
            cp "app/src/main/res/drawable/ic_launcher_sidd.png" /tmp/siddtradu17/app/src/main/res/drawable/ic_launcher_sidd.png
          fi

          if [ -f "MainActivity.kt" ]; then
            cp "MainActivity.kt" /tmp/siddtradu17/app/src/main/java/com/cuentalmt17/gametraduccin/MainActivity.kt
          fi
          if [ -f "FloatingBubbleService.kt" ]; then
            cp "FloatingBubbleService.kt" /tmp/siddtradu17/app/src/main/java/com/cuentalmt17/gametraduccin/overlay/FloatingBubbleService.kt
          fi
          if [ -f "TranslationOverlayView.kt" ]; then
            cp "TranslationOverlayView.kt" /tmp/siddtradu17/app/src/main/java/com/cuentalmt17/gametraduccin/overlay/TranslationOverlayView.kt
          fi
          if [ -f "ScreenCaptureHelper.kt" ]; then
            cp "ScreenCaptureHelper.kt" /tmp/siddtradu17/app/src/main/java/com/cuentalmt17/gametraduccin/capture/ScreenCaptureHelper.kt
          fi
          if [ -f "OcrHelper.kt" ]; then
            cp "OcrHelper.kt" /tmp/siddtradu17/app/src/main/java/com/cuentalmt17/gametraduccin/ocr/OcrHelper.kt
          fi
          if [ -f "TranslationCacheHelper.kt" ]; then
            cp "TranslationCacheHelper.kt" /tmp/siddtradu17/app/src/main/java/com/cuentalmt17/gametraduccin/translate/TranslationCacheHelper.kt
          fi
          if [ -f "TranslatorHelper.kt" ]; then
            cp "TranslatorHelper.kt" /tmp/siddtradu17/app/src/main/java/com/cuentalmt17/gametraduccin/translate/TranslatorHelper.kt
          fi

          cd /tmp/siddtradu17
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          ./gradlew assembleDebug --no-daemon
          cp /tmp/siddtradu17/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/SiddTradu17-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiddTradu17-apk
          path: SiddTradu17-debug.apk
